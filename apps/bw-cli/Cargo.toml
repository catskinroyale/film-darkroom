[package]
name = "bw-cli"
description = "Command-line front end for the black-and-white emulation engine."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bw"
path = "src/main.rs"

[dependencies]
fd-core = { path = "../../crates/fd-core" }
bw-film = { path = "../../crates/bw-film" }
bw-developer = { path = "../../crates/bw-developer" }
bw-negative = { path = "../../crates/bw-negative" }
bw-darkroom = { path = "../../crates/bw-darkroom" }
clap = { version = "4", features = ["derive"] }
fd-io = { path = "../../crates/fd-io" }

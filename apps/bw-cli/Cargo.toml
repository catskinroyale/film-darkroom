[package]
name = "bw-cli"
description = "Command-line front end for the black-and-white emulation engine."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bw"
path = "src/main.rs"

[dependencies]
fd-core = { path = "../../crates/fd-core" }
mono-film = { path = "../../crates/mono-film" }
mono-developer = { path = "../../crates/mono-developer" }
mono-negative = { path = "../../crates/mono-negative" }
mono-darkroom = { path = "../../crates/mono-darkroom" }
clap = { version = "4", features = ["derive"] }
fd-io = { path = "../../crates/fd-io" }

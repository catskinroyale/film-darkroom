[package]
name = "cd-cli"
description = "Command-line front end for the colour film emulation engine."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "colour"
path = "src/main.rs"

[dependencies]
fd-core = { path = "../../crates/fd-core" }
fd-io = { path = "../../crates/fd-io" }
fd-raw = { path = "../../crates/fd-raw" }
cd-profiles = { path = "../../crates/cd-profiles" }
clap = { version = "4", features = ["derive"] }
rayon.workspace = true

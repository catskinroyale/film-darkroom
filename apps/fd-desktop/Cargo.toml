[package]
name = "fd-desktop"
description = "Desktop darkroom: browse images, preview colour and black-and-white film styles, export prints."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "film-darkroom"
path = "src/main.rs"

[dependencies]
fd-core = { path = "../../crates/fd-core" }
fd-io = { path = "../../crates/fd-io" }
fd-profiles = { path = "../../crates/fd-profiles" }
fd-raw = { path = "../../crates/fd-raw" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.17"
dirs = "7"
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native application menu (About, Hide, Quit, Window), MIT OR Apache-2.0.
muda = { version = "0.21", default-features = false }

[dev-dependencies]
exif = { package = "kamadak-exif", version = "0.6" }

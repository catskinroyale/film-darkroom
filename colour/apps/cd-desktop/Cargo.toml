[package]
name = "cd-desktop"
description = "Desktop colour darkroom: browse images, preview film looks, export prints."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "colour-darkroom"
path = "src/main.rs"

[dependencies]
cd-core = { path = "../../crates/cd-core" }
cd-io = { path = "../../crates/cd-io" }
cd-profiles = { path = "../../crates/cd-profiles" }
cd-raw = { path = "../../crates/cd-raw" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.17"
dirs = "7"
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native application menu (About, Hide, Quit, Window), MIT OR Apache-2.0.
muda = { version = "0.21", default-features = false }

[dev-dependencies]
exif = { package = "kamadak-exif", version = "0.6" }
